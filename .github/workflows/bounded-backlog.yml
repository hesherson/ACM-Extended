name: Bounded backlog verification
on:
  push:
    branches: [audit/bounded-backlog-20260923]
    paths: [.audit/bounded/**, .github/workflows/bounded-backlog.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acme-bounded-backlog-20260923
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verified toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl --fail --location --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl --fail --location --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'pytest-subtests==0.15.0' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate and publish isolated review branch
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: python .audit/bounded/verify.py
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acme-bounded-backlog-20260923
          path: /tmp/acme-bounded-results
          retention-days: 30
