name: Bounded W-X audit
on:
  push:
    branches: [audit/bounded-backlog-wx-20260923]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bounded-wx-20260923
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify staged source bytes
        run: |
          python - <<'PY'
          import pathlib, hashlib
          checks = {'test_bounded_selector_lifetime.py':'0154a0a85736746b970741cc334a828d9968a43b84298c17abd1ea888173d236','test_bounded_selector_geometry.py':'5544962a2581ab0166f97f2cf199e77389a2e38d6a28f3544a6434aa25264889'}
          for name,digest in checks.items():
              raw=(pathlib.Path('.audit/wx')/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest,name
              compile(raw,name,'exec')
          compile(pathlib.Path('.audit/wx/validate.py').read_text(),'validate.py','exec')
          PY
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 1 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate and publish scoped checkpoint
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: python .audit/wx/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-bounded-W-X-evidence
          path: /tmp/acme-wx-results
          retention-days: 30
