name: Confirmed lifecycle validation
on:
  push:
    branches: [fix/2026-09-22-confirmed-lifecycle]
    paths: [.github/workflows/lifecycle-validate.yml, .audit/lifecycle-edits-*.json, .audit/prepare-lifecycle.py, .audit/test_confirmed_lifecycle_20260922.py]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct hash-pinned candidate without changing main
        run: |
          mkdir -p /tmp/lifecycle-results
          git fetch --no-tags --depth=1 origin c3dd15f41a56a253461d876b478f91849d23551f
          git worktree add --detach /tmp/acme-lifecycle-candidate c3dd15f41a56a253461d876b478f91849d23551f
          set -o pipefail
          python3 .audit/prepare-lifecycle.py /tmp/acme-lifecycle-candidate | tee /tmp/lifecycle-results/source-hashes.log
      - name: Install verified pinned test tools
        run: |
          mkdir -p /tmp/lifecycle-tools
          curl --fail --location --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/lifecycle-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/lifecycle-tools/hemtt' | sha256sum --check
          curl --fail --location --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/lifecycle-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/lifecycle-tools/sqfvm.zip' | sha256sum --check
          unzip /tmp/lifecycle-tools/sqfvm.zip -d /tmp/lifecycle-tools
          chmod +x /tmp/lifecycle-tools/hemtt /tmp/lifecycle-tools/sqfvm_linux_x64_gcc/sqfvm
          python3 -m pip install pytest pytest-subtests
      - name: Focused preservation and executable regression tests
        env:
          HEMTT: /tmp/lifecycle-tools/hemtt
          SQFVM: /tmp/lifecycle-tools/sqfvm_linux_x64_gcc/sqfvm
        run: |
          cd /tmp/acme-lifecycle-candidate
          set -o pipefail
          python3 -m pytest tools/test_self_audit_20260922.py addons/acm_extended/tools/test_confirmed_lifecycle_20260922.py addons/acm_extended/tools/test_consciousness_wake_latch_20260921.py addons/acm_extended/tools/test_seizure_paralysis_suppression.py addons/acm_extended/tools/test_seizure_gesture_unification.py addons/acm_extended/tools/test_debug_seizure_action.py addons/acm_extended/tools/test_bvm_startup.py addons/acm_extended/tools/test_iv_ui_followup_patch.py addons/acm_extended/tools/test_wake_execution_20260922.py addons/acm_extended/tools/test_config_compile.py -q --junitxml=/tmp/lifecycle-results/focused.xml | tee /tmp/lifecycle-results/focused.log
          python3 -m pytest addons/acm_extended/tools/test_menu_death_lifecycle.py addons/acm_extended/tools/test_owner_locality_audit_20260920.py -k 'head_tilt or hang_bag' -q --junitxml=/tmp/lifecycle-results/related.xml | tee /tmp/lifecycle-results/related.log
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          for name, expected in [('focused',184),('related',10)]:
              suite=E.parse('/tmp/lifecycle-results/'+name+'.xml').getroot().find('testsuite')
              assert int(suite.get('tests')) == expected, suite.attrib
              assert all(int(suite.get(k,'0')) == 0 for k in ['failures','errors','skipped']), suite.attrib
          PY
      - name: Complete project HEMTT check
        run: |
          cd /tmp/acme-lifecycle-candidate
          set -o pipefail
          /tmp/lifecycle-tools/hemtt check 2>&1 | tee /tmp/lifecycle-results/hemtt.log
          echo 'HEMTT check exit code: 0' >> /tmp/lifecycle-results/hemtt.log
          git diff --cached --check
      - name: Publish only the validated production source to the feature branch
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path('/tmp/acme-lifecycle-candidate')
          def git(*args): return subprocess.check_output(['git',*args],cwd=root,text=True).strip()
          base='c3dd15f41a56a253461d876b478f91849d23551f'
          tree='d01ae33c9fe24073ea6a590f044b41aa0efeb23f'
          branch='fix/20260922-verified-lifecycle-issues'
          assert git('rev-parse','HEAD') == base
          assert git('write-tree') == tree
          assert not git('diff','--name-only'), 'Unstaged source changes after validation'
          assert len(git('diff','--cached','--name-only').splitlines()) == 15
          remote=git('ls-remote','origin','refs/heads/'+branch).split()[0]
          assert remote == base, 'Feature branch moved; reconcile before publishing'
          env={**os.environ,'GIT_AUTHOR_NAME':'github-actions[bot]','GIT_AUTHOR_EMAIL':'41898282+github-actions[bot]@users.noreply.github.com','GIT_COMMITTER_NAME':'github-actions[bot]','GIT_COMMITTER_EMAIL':'41898282+github-actions[bot]@users.noreply.github.com'}
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',base,'-m','Fix verified surgical, player-switch, stethoscope and Hang Bag lifecycle defects'],cwd=root,env=env,text=True).strip()
          subprocess.run(['git','push','origin',commit+':refs/heads/'+branch],cwd=root,check=True)
          pathlib.Path('/tmp/lifecycle-results/candidate.txt').write_text(commit+'\n'+tree+'\n'+base+'\n')
          print('Validated feature commit:',commit)
          print('Main was not modified by this workflow.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmed-lifecycle-results
          path: /tmp/lifecycle-results
          retention-days: 14
