name: Historical backlog batch 6 validation
on:
  push:
    branches: [audit/historical-backlog-batch6-20260922]
    paths: [.github/workflows/historical-backlog-batch6.yml, .audit/historical-batch6/**]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned verification tools
        run: |
          mkdir -p /tmp/acme-tools /tmp/acme-backlog6-results
          curl --fail --location --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl --fail --location --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
          python -m pip freeze > /tmp/acme-backlog6-results/python-packages.txt
      - name: Verify exact reviewed source and outcomes
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: |
          set -o pipefail
          python .audit/historical-batch6/validate.py | tee /tmp/acme-backlog6-results/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-backlog-batch6-results
          path: /tmp/acme-backlog6-results
          retention-days: 14
