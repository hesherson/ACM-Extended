name: Release gate BC-BD
on:
  push:
    branches: [audit/release-gate-bc-bd-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-gate-bc-bd
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 647692d436a7a592e1755cae66c4d64486879db9
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          chmod +x /tmp/acme-tools/hemtt
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Full BC-BD comparison
        env:
          HEMTT: /tmp/acme-tools/hemtt
        run: |
          python - <<'PY'
          import subprocess,pathlib,xml.etree.ElementTree as ET,json,os
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          BASE='586271f324d74cace5f8d845065ee6e4499f1774'
          CAND='647692d436a7a592e1755cae66c4d64486879db9'
          root=pathlib.Path.cwd(); before=pathlib.Path('/tmp/bcbd-before'); out=pathlib.Path('/tmp/bcbd-out'); out.mkdir(exist_ok=True)
          def cmd(a,cwd=root,t=480,check=True):
              r=subprocess.run(a,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=t)
              if check and r.returncode: raise RuntimeError(str(a)+'\n'+r.stdout[-12000:])
              return r
          def suite(label,cwd,paths):
              x=out/(label+'.xml')
              r=cmd(['python','-m','pytest',*paths,'-q','--tb=no','--continue-on-collection-errors','--junitxml='+str(x)],cwd,430,False)
              d={}
              for c in ET.parse(x).iter('testcase'):
                  k=(c.get('classname',''),c.get('name',''))
                  d[k]='error' if c.find('error') is not None else 'failed' if c.find('failure') is not None else 'skipped' if c.find('skipped') is not None else 'passed'
              (out/(label+'.log')).write_text(r.stdout); return r.returncode,d,Counter(d.values())
          assert cmd(['git','rev-parse','HEAD']).stdout.strip()==CAND
          cmd(['git','fetch','--depth=1','origin',BASE]); cmd(['git','worktree','add','--detach',str(before),BASE])
          h=cmd([os.environ['HEMTT'],'check'],root,180,False); (out/'hemtt.log').write_text(h.stdout); assert h.returncode==0
          with ThreadPoolExecutor(max_workers=2) as ex:
              fb=ex.submit(suite,'addon-before',before,['addons/acm_extended/tools']); fa=ex.submit(suite,'addon-after',root,['addons/acm_extended/tools'])
              _,db,cb=fb.result(); _,da,ca=fa.result()
          missing=set(db)-set(da); regress=[]; fixed=[]
          for k,v in db.items():
              if k not in da: continue
              if v=='failed' and da[k]=='passed': fixed.append(k)
              elif v!=da[k]: regress.append((k,v,da[k]))
          expected=set(["test_pre_b20_geometry_is_restored","test_no_b20_meter_or_relayout","test_stethoscope_lifecycle_has_one_pose_owner_and_native_cleanup","test_callbacks_item_counts_and_pending_reopen_are_retained","test_hang_bag_normal_entry_and_exit_blend","test_carousel_motion_is_one_physical_slide_then_zero_duration_rebind","test_single_syringe_still_only_nudges_then_recenters","test_expanded_view_lingers_and_motion_is_smooth_longer_slide","test_save_button_has_success_flash_then_fresh_reset","test_feedback_lingers","test_historical_head_menu_contract[provider DraggerBase wrapper]","test_historical_head_menu_contract[provider sequence uses lift wrapper]","test_historical_head_menu_contract[provider waits for one preflight]","test_historical_head_menu_contract[duplicate holster suppression]","test_turning_one_off_preserves_others","test_all_previous_consumer_surfaces_read_effective_checkbox","test_darkness_runs_after_procedure_for_all_views"])
          assert not missing and not regress,(missing,regress)
          assert {k[1] for k in fixed}==expected,(len(fixed),fixed)
          assert len(fixed)==17
          with ThreadPoolExecutor(max_workers=2) as ex:
              rb=ex.submit(suite,'root-before',before,['tools']); ra=ex.submit(suite,'root-after',root,['tools'])
              _,dbr,cbr=rb.result(); _,dar,car=ra.result()
          assert dbr==dar and cbr==car,(cbr,car)
          changed=set(filter(None,cmd(['git','diff','--name-only',BASE,CAND]).stdout.splitlines()))
          runtime=[p for p in changed if '/functions/' in p and p.endswith('.sqf')]
          config=[p for p in changed if p.endswith('config.cpp') or p.endswith('.hpp')]
          assert runtime==[] and config==[],(runtime,config)
          report={'base':BASE,'candidate':CAND,'addon_before':dict(cb),'addon_after':dict(ca),'fixed_stale_outcomes':17,'remaining_addon_failures':ca.get('failed',0),'root_before':dict(cbr),'root_after':dict(car),'runtime_files_changed':[],'config_files_changed':[],'hemtt_exit':0}
          (out/'report.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-release-gate-BC-BD-evidence
          path: /tmp/bcbd-out
          retention-days: 30
