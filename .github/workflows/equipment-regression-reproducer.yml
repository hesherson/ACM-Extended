name: Equipment regression reproducer

on:
  pull_request:
    branches: [main]
    paths:
      - "addons/acm_extended/functions/fn_*Carrier*.sqf"
      - "addons/acm_extended/functions/fn_carrier*.sqf"
      - "addons/acm_extended/functions/fn_hangBag*.sqf"
      - "addons/acm_extended/tools/test_b26*.py"
      - ".github/workflows/equipment-regression-reproducer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-reproducer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Capture the exact source and toolchain used by the regression harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-reproducer/toolchain
          git rev-parse HEAD > /tmp/acme-reproducer/commit.txt
          git archive --format=zip --output=/tmp/acme-reproducer/source.zip HEAD
          curl -fLsS --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-reproducer/toolchain/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-reproducer/toolchain/hemtt' | sha256sum --check
          curl -fLsS --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-reproducer/toolchain/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-reproducer/toolchain/sqfvm.zip' | sha256sum --check
          printf '%s\n' 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1' > /tmp/acme-reproducer/requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-source-reproducer-${{ github.run_id }}
          path: /tmp/acme-reproducer/
          if-no-files-found: error
          retention-days: 7
