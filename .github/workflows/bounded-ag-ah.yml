name: Bounded AG-AH audit
on:
  push:
    branches: [audit/bounded-backlog-ag-ah-20260923]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bounded-ag-ah-20260923
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile runner and verify reviewed test transport
        run: |
          python -m py_compile .audit/ag-ah/validate.py .audit/ag-ah/workspace.py .audit/ag-ah/endpoints.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.audit/ag-ah')
          for name,expected in {
            'reviewed.patch':'7e05bb3297bfebc0645c438ff5cbfad7660077e99e92b5ea88e3dd6f52704b98',
            'workspace.py':'75434a2483b75a09661722ea744d73f07590ea45fcb8d608ea28a1e83a4b27bd',
            'endpoints.py':'817b96111da13ec9475c75aaf65cabf825fc979005a453b467ee28e0a90017b7'
          }.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          PY
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --connect-timeout 15 --max-time 60 --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --connect-timeout 15 --max-time 60 --retry 1 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate complete checkouts and publish isolated checkpoint
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: python .audit/ag-ah/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-bounded-AG-AH-evidence
          path: /tmp/acme-ag-ah-results
          retention-days: 30
