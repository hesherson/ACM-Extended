name: ACME audit toolchain
on:
  push:
    branches: [audit/2026-09-22-preserve-regressions]
    paths: [.github/workflows/acme-audit-toolchain.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify pinned releases
        run: |
          mkdir -p /tmp/acme-tools
          curl --fail --location --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl --fail --location --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools/sqfvm
          chmod +x /tmp/acme-tools/hemtt
          /tmp/acme-tools/hemtt --version
      - uses: actions/upload-artifact@v4
        with:
          name: acme-audit-tools
          path: /tmp/acme-tools
          retention-days: 7
