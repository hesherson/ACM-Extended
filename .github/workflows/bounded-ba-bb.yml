name: Bounded BA-BB focused
on:
  push:
    branches: [audit/bounded-backlog-ba-bb-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-ba-bb-focused
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/bounded-backlog-ba-bb-20260923
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and HEMTT
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          chmod +x /tmp/acme-tools/hemtt
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Focused 35-ID carousel gate
        env:
          HEMTT: /tmp/acme-tools/hemtt
        run: |
          python -m pytest 'addons/acm_extended/tools/test_b58_syringe_carousel_tags.py::test_final_name_ui_removed_and_drawn_body_only' \
            'addons/acm_extended/tools/test_b58_syringe_carousel_tags.py::test_carousel_headers_summary_and_patient_location' \
            'addons/acm_extended/tools/test_b59_shared_syringe_body_carousel.py::test_body_map_has_compact_three_slot_mini_carousel' \
            'addons/acm_extended/tools/test_b59_shared_syringe_body_carousel.py::test_body_preview_renders_real_fill_tag_and_summary' \
            'addons/acm_extended/tools/test_b59_shared_syringe_body_carousel.py::test_carousel_hides_draw_ui_sections_and_uses_native_scale' \
            'addons/acm_extended/tools/test_b60_dynamic_syringe_body_tandem.py::test_body_and_carousel_have_compact_and_expanded_geometry' \
            'addons/acm_extended/tools/test_b60_dynamic_syringe_body_tandem.py::test_active_syringe_is_85_percent_then_100_percent_on_hover' \
            'addons/acm_extended/tools/test_b60_dynamic_syringe_body_tandem.py::test_save_returns_to_large_body_and_compact_carousel' \
            'addons/acm_extended/tools/test_b61_carousel_bodymap_refinement.py::test_ultrawide_carousel_width_is_capped_and_moved_lower' \
            'addons/acm_extended/tools/test_b61_carousel_bodymap_refinement.py::test_body_shrink_is_stronger_and_route_row_clears_body' \
            'addons/acm_extended/tools/test_b61_carousel_bodymap_refinement.py::test_carousel_zoom_falloff_is_more_pronounced_but_active_remains_85_percent' \
            'addons/acm_extended/tools/test_b61_carousel_bodymap_refinement.py::test_active_hover_target_is_larger_and_above_neighbor_targets' \
            'addons/acm_extended/tools/test_b62_tag_editor_carousel_layout.py::test_wide_carousel_retention_zone_spans_route_to_draw_workspace' \
            'addons/acm_extended/tools/test_b62_tag_editor_carousel_layout.py::test_compact_syringes_are_larger_and_carousel_is_tighter_on_ultrawide' \
            'addons/acm_extended/tools/test_b62_tag_editor_carousel_layout.py::test_body_moves_down_and_shrinks_more_during_promoted_carousel' \
            'addons/acm_extended/tools/test_b62_tag_editor_carousel_layout.py::test_active_syringe_still_85_percent_and_hover_is_100_percent_with_bigger_target' \
            'addons/acm_extended/tools/test_b63_tag_carousel_interaction.py::test_body_map_edit_tag_is_above_syringe_below_route' \
            'addons/acm_extended/tools/test_b63_tag_carousel_interaction.py::test_carousel_is_toolbar_width_and_body_contracts_more' \
            'addons/acm_extended/tools/test_b63_tag_carousel_interaction.py::test_carousel_art_is_larger_inside_tighter_footprint' \
            'addons/acm_extended/tools/test_b63_tag_carousel_interaction.py::test_carousel_has_fading_gray_underlay' \
            'addons/acm_extended/tools/test_b63_tag_carousel_interaction.py::test_patient_header_is_name_only_and_raised_in_body_view' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_main_draw_always_has_select_syringe_tag_left_of_native_syringe' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_edit_syringe_tag_is_attached_to_full_route_row' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_carousel_track_is_narrow_but_promoted_syringe_scale_is_restored' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_carousel_workspace_stays_between_edit_row_and_draw_row' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_carousel_hitboxes_cannot_cover_edit_or_draw_rows' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_ad_arrow_key_hints_exist_scale_and_hide_in_editor' \
            'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_patient_name_uses_actual_screen_to_head_gap' \
            'addons/acm_extended/tools/test_b66_syringe_carousel_main_tag.py::test_compact_and_promoted_tracks_are_distinct_and_promoted_is_wider' \
            'addons/acm_extended/tools/test_b66_syringe_carousel_main_tag.py::test_promoted_syringes_are_larger_and_ad_hints_move_outward' \
            'addons/acm_extended/tools/test_b66_syringe_carousel_main_tag.py::test_carousel_hit_regions_end_above_draw_syringe' \
            'addons/acm_extended/tools/test_b66_syringe_carousel_main_tag.py::test_patient_name_is_raised_farther_in_screen_to_head_gap' \
            'addons/acm_extended/tools/test_b68_syringe_tag_push_layout.py::test_promoted_syringes_are_larger_and_carousel_motion_is_real_slide_grow' \
            'addons/acm_extended/tools/test_b69_narcbox_carousel_visibility.py::test_promotion_animates_hints_with_syringes_and_preserves_each_plunger_fill' \
            'addons/acm_extended/tools/test_b70_semifowler_bvm_thora_syringe.py::test_edit_tag_stays_visible_during_ad_and_center_click_toggles_carousel' \
            'addons/acm_extended/tools/test_bounded_current_carousel_contract.py' -q
          /tmp/acme-tools/hemtt check
