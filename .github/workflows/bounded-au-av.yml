name: Bounded AU-AV audit
on:
  push:
    branches: [audit/bounded-backlog-au-av-20260923]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6a5b07e1ec809966ec65398933fbce13e4c6bcb
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 1 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate AU-AV
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: |
          python - <<'PY'
          import subprocess,pathlib,xml.etree.ElementTree as ET,json,os
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          BASE='6f4324e0eebf6c55b498c68cedbdc94491b02b10'; CAND='d6a5b07e1ec809966ec65398933fbce13e4c6bcb'
          root=pathlib.Path.cwd(); before=pathlib.Path('/tmp/before'); after=pathlib.Path('/tmp/after'); out=pathlib.Path('/tmp/out'); out.mkdir(exist_ok=True)
          def cmd(a,cwd=root,t=480,check=True):
              r=subprocess.run(a,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=t)
              if check and r.returncode: raise RuntimeError(r.stdout[-12000:])
              return r
          cmd(['git','fetch','--depth=1','origin',BASE]); cmd(['git','fetch','--depth=1','origin',CAND])
          cmd(['git','worktree','add','--detach',str(before),BASE]); cmd(['git','worktree','add','--detach',str(after),CAND])
          focused=[
          'addons/acm_extended/tools/test_b40_animation_audit.py::test_movement_queues_are_explicit_priority_one',
          'addons/acm_extended/tools/test_b40_animation_audit.py::test_hpmk_roll_uses_guarded_animation_wrapper',
          'addons/acm_extended/tools/test_b40_animation_audit.py::test_cpr_authored_exit_blends',
          'addons/acm_extended/tools/test_b40_animation_audit.py::test_remaining_hard_switches_are_known_state_locks_only',
          'addons/acm_extended/tools/test_b44_requested_fixes.py::test_roll_provider_emptyhand_wrapper',
          'addons/acm_extended/tools/test_b47_animation_contracts.py::test_stethoscope_hold_is_minigame_owned',
          'addons/acm_extended/tools/test_b47_animation_contracts.py::test_roll_uses_shared_medic4_pose_for_2_5_seconds',
          'addons/acm_extended/tools/test_b48_medication_animation_orientation.py::test_exact_chest_roll_provider_animation_is_forced',
          'addons/acm_extended/tools/test_b48_medication_animation_orientation.py::test_requested_assessment_animations_and_durations_retained',
          'addons/acm_extended/tools/test_b73_syringe_tag_vial_carousel_anim.py::test_provider_roll_uses_crouch_connected_wrapper_and_no_switchmove_fallback',
          'addons/acm_extended/tools/test_b73_syringe_tag_vial_carousel_anim.py::test_other_current_medical_transition_entries_use_priority_one',
          'addons/acm_extended/tools/test_b73_syringe_tag_vial_carousel_anim.py::test_no_acme_medical_animation_entry_uses_priority_two_switchmove_fallback']
          r=cmd(['python','-m','pytest',*focused,'-q'],after,180,False); (out/'focused.log').write_text(r.stdout); assert r.returncode==0,r.stdout[-10000:]
          h=cmd([os.environ['HEMTT'],'check'],after,180,False); (out/'hemtt.log').write_text(h.stdout); assert h.returncode==0,h.stdout[-10000:]
          assert cmd(['git','diff','--check',BASE,CAND],after,60,False).returncode==0
          def suite(label,cwd,paths):
              x=out/(label+'.xml'); r=cmd(['python','-m','pytest',*paths,'-q','--tb=no','--continue-on-collection-errors','--junitxml='+str(x)],cwd,430,False)
              d={}
              for c in ET.parse(x).iter('testcase'):
                  k=(c.get('classname',''),c.get('name','')); d[k]='error' if c.find('error') is not None else 'failed' if c.find('failure') is not None else 'skipped' if c.find('skipped') is not None else 'passed'
              (out/(label+'.log')).write_text(r.stdout); return r.returncode,d,Counter(d.values())
          with ThreadPoolExecutor(max_workers=2) as ex:
              fb=ex.submit(suite,'addon-before',before,['addons/acm_extended/tools']); fa=ex.submit(suite,'addon-after',after,['addons/acm_extended/tools'])
              rb,db,cb=fb.result(); ra,da,ca=fa.result()
          missing=set(db)-set(da); regress=[]; fixed=[]
          for k,v in db.items():
              if k not in da: continue
              if v=='failed' and da[k]=='passed': fixed.append(k)
              elif v!=da[k]: regress.append((k,v,da[k]))
          expected={'test_movement_queues_are_explicit_priority_one','test_hpmk_roll_uses_guarded_animation_wrapper','test_cpr_authored_exit_blends','test_remaining_hard_switches_are_known_state_locks_only','test_roll_provider_emptyhand_wrapper','test_stethoscope_hold_is_minigame_owned','test_roll_uses_shared_medic4_pose_for_2_5_seconds','test_exact_chest_roll_provider_animation_is_forced','test_requested_assessment_animations_and_durations_retained','test_provider_roll_uses_crouch_connected_wrapper_and_no_switchmove_fallback','test_other_current_medical_transition_entries_use_priority_one','test_no_acme_medical_animation_entry_uses_priority_two_switchmove_fallback'}
          assert not missing and not regress,(missing,regress); assert {k[1] for k in fixed}==expected,fixed
          with ThreadPoolExecutor(max_workers=2) as ex:
              rb2=ex.submit(suite,'root-before',before,['tools']); ra2=ex.submit(suite,'root-after',after,['tools'])
              _,db2,cb2=rb2.result(); _,da2,ca2=ra2.result()
          assert db2==da2 and cb2==ca2,(cb2,ca2)
          report={'base':BASE,'candidate':CAND,'focused_passed':12,'addon_before':dict(cb),'addon_after':dict(ca),'fixed_original_ids':['H132','H133','H134','H135','H156','H179','H181','H189','H190','H366','H369','H370'],'remaining_original_entries':47,'root_before':dict(cb2),'root_after':dict(ca2),'hemtt_exit':0,'runtime_files_changed':[],'live_arma_tested':False}
          (out/'report.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-bounded-AU-AV-evidence
          path: /tmp/out
          retention-days: 30
