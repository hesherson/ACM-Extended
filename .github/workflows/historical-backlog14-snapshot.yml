name: Historical backlog 14 source snapshot
on:
  push:
    branches: [audit/historical-backlog-batch14-20260922]
    paths: [.github/workflows/historical-backlog14-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac215faa83917e38518b270d44e4d6f96366dad7
      - name: Snapshot tracked text and exact object identities
        run: |
          mkdir -p /tmp/backlog14
          python3 - <<'PY'
          import json,pathlib,subprocess,zipfile
          files={}
          for record in subprocess.check_output(['git','ls-tree','-rz','HEAD']).split(b'\0'):
              if not record: continue
              meta,path=record.split(b'\t',1)
              mode,kind,sha=meta.decode().split()
              if kind=='blob': files[path.decode()]={'sha':sha,'mode':mode}
          with zipfile.ZipFile('/tmp/backlog14/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),'files':files},indent=2))
              z.writestr('commit.raw',subprocess.check_output(['git','cat-file','commit','HEAD']))
              for name in files:
                  data=pathlib.Path(name).read_bytes()
                  try: data.decode('utf-8')
                  except UnicodeDecodeError: continue
                  z.writestr('source/'+name,data)
          print('Tracked files:',len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backlog14-source
          path: /tmp/backlog14/source.zip
          retention-days: 7
