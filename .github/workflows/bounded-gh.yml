name: Bounded G-H audit
on:
  push:
    branches: [audit/bounded-backlog-gh-20260923]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bounded-gh-20260923
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify patch transport
        run: |
          python -m py_compile .audit/gh/validate.py
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          expected={'G':'3ccbf4abb5e3e93b2aa2983861fb5be5bafe99673dc68eeccc71751514c1c909','H':'7b5032f4540fa62eadb39bc7c93237948bf802639106f69e7e2cef60aa80c6c7'}
          for label,digest in expected.items():
              raw=gzip.decompress(base64.b64decode(Path('.audit/gh/'+label+'.b64').read_text().strip(),validate=True))
              assert hashlib.sha256(raw).hexdigest()==digest,label
          PY
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 1 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate and publish scoped checkpoint
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: python .audit/gh/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-bounded-G-H-evidence
          path: /tmp/acme-gh-results
          retention-days: 30
