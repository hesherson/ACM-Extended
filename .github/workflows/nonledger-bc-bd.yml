name: Non-ledger BC-BD audit
on:
  push:
    branches: [audit/nonledger-bc-bd-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nonledger-bc-bd-20260923
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/nonledger-bc-bd-20260923
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          chmod +x /tmp/acme-tools/hemtt
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate BC-BD
        env:
          HEMTT: /tmp/acme-tools/hemtt
        run: |
          python - <<'PY'
          import subprocess,pathlib,xml.etree.ElementTree as ET,json,os
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          BASE='586271f324d74cace5f8d845065ee6e4499f1774'
          root=pathlib.Path.cwd()
          CAND=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          before=pathlib.Path('/tmp/bcbd-before')
          out=pathlib.Path('/tmp/bcbd-out'); out.mkdir(exist_ok=True)
          def cmd(a,cwd=root,t=480,check=True):
              r=subprocess.run(a,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=t)
              if check and r.returncode: raise RuntimeError(r.stdout[-12000:])
              return r
          def suite(label,cwd,paths):
              x=out/(label+'.xml')
              r=cmd(['python','-m','pytest',*paths,'-q','--tb=no','--continue-on-collection-errors','--junitxml='+str(x)],cwd,430,False)
              d={}
              for c in ET.parse(x).iter('testcase'):
                  k=(c.get('classname',''),c.get('name',''))
                  d[k]='error' if c.find('error') is not None else 'failed' if c.find('failure') is not None else 'skipped' if c.find('skipped') is not None else 'passed'
              (out/(label+'.log')).write_text(r.stdout); return r.returncode,d,Counter(d.values())
          cmd(['git','fetch','--depth=1','origin',BASE])
          cmd(['git','worktree','add','--detach',str(before),BASE])
          focused=[
           'addons/acm_extended/tools/test_b20_vent_debug_narcbox.py::B20NarcBox::test_pre_b20_geometry_is_restored',
           'addons/acm_extended/tools/test_b22_narc_revert.py::B22UIContracts::test_no_b20_meter_or_relayout',
           'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_carousel_motion_is_one_physical_slide_then_zero_duration_rebind',
           'addons/acm_extended/tools/test_b64_syringe_tag_carousel_refinement.py::test_single_syringe_still_only_nudges_then_recenters',
           'addons/acm_extended/tools/test_b66_syringe_carousel_main_tag.py::test_expanded_view_lingers_and_motion_is_smooth_longer_slide',
           'addons/acm_extended/tools/test_b73_syringe_tag_vial_carousel_anim.py::test_save_button_has_success_flash_then_fresh_reset',
           'addons/acm_extended/tools/test_b76_carousel_push_memory.py::test_feedback_lingers',
           'addons/acm_extended/tools/test_na8_5_batch9.py::SourceContracts::test_darkness_runs_after_procedure_for_all_views']
          r=cmd(['python','-m','pytest',*focused,'-q'],root,180,False)
          (out/'focused.log').write_text(r.stdout); assert r.returncode==0,r.stdout[-9000:]
          h=cmd([os.environ['HEMTT'],'check'],root,180,False); (out/'hemtt.log').write_text(h.stdout); assert h.returncode==0
          with ThreadPoolExecutor(max_workers=2) as ex:
              fb=ex.submit(suite,'addon-before',before,['addons/acm_extended/tools']); fa=ex.submit(suite,'addon-after',root,['addons/acm_extended/tools'])
              rb,db,cb=fb.result(); ra,da,ca=fa.result()
          missing=set(db)-set(da); regress=[]; fixed=[]
          for k,v in db.items():
              if k not in da: continue
              if v=='failed' and da[k]=='passed': fixed.append(k)
              elif v!=da[k]: regress.append((k,v,da[k]))
          expected={
           'test_pre_b20_geometry_is_restored','test_no_b20_meter_or_relayout',
           'test_carousel_motion_is_one_physical_slide_then_zero_duration_rebind',
           'test_single_syringe_still_only_nudges_then_recenters',
           'test_expanded_view_lingers_and_motion_is_smooth_longer_slide',
           'test_save_button_has_success_flash_then_fresh_reset',
           'test_feedback_lingers','test_darkness_runs_after_procedure_for_all_views'}
          assert not missing and not regress,(missing,regress)
          assert {k[1] for k in fixed}==expected,fixed
          with ThreadPoolExecutor(max_workers=2) as ex:
              a=ex.submit(suite,'root-before',before,['tools']); b=ex.submit(suite,'root-after',root,['tools'])
              _,db2,cb2=a.result(); _,da2,ca2=b.result()
          assert db2==da2 and cb2==ca2,(cb2,ca2)
          changed=set(filter(None,cmd(['git','diff','--name-only',BASE,CAND]).stdout.splitlines()))
          runtime=[p for p in changed if '/functions/' in p and p.endswith('.sqf')]
          config=[p for p in changed if p.endswith('.hpp') or p.endswith('config.cpp')]
          assert runtime==[] and config==[],(runtime,config)
          report={'base':BASE,'candidate':CAND,'focused_passed':8,'addon_before':dict(cb),'addon_after':dict(ca),
                  'fixed_nonledger_identities':sorted(expected),'root_before':dict(cb2),'root_after':dict(ca2),
                  'runtime_files_changed':[],'config_files_changed':[],'hemtt_exit':0,'live_arma_tested':False}
          (out/'report.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-nonledger-BC-BD-evidence
          path: /tmp/bcbd-out
          retention-days: 30
