name: Stable network audit

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "tools/**"
      - ".github/workflows/b204-network-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "addons/**"
      - "tools/**"
      - ".github/workflows/b204-network-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-network-audit-${{ github.ref }}
  cancel-in-progress: true

# B236: parity is a development gate, not release approval. The independent
# strict job intentionally remains red while inherited failures/errors exist.
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validation toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'

      - name: Source and native-state ownership gates
        run: |
          git diff --check 90e47ed7a2fc457099255f477f2b476fdae2ce9b HEAD
          python tools/build_contract.py
          python tools/audit_acme_native_owner_writes.py --strict
      - name: HEMTT static validation
        run: /tmp/acme-tools/hemtt check --error-on-all

  full-regression-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: addon
            shard: 0
          - group: addon
            shard: 1
          - group: addon
            shard: 2
          - group: addon
            shard: 3
          - group: addon
            shard: 4
          - group: addon
            shard: 5
          - group: addon
            shard: 6
          - group: addon
            shard: 7
          - group: root
            shard: 0
          - group: root
            shard: 1
          - group: root
            shard: 2
          - group: root
            shard: 3
    env:
      SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
      HEMTT: /tmp/acme-tools/hemtt
      HEMTT_BINARY: /tmp/acme-tools/hemtt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validation toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 2 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 2 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'

      - name: Prepare immutable audited B235 baseline
        run: git worktree add --detach /tmp/acme-before 90e47ed7a2fc457099255f477f2b476fdae2ce9b
      - name: Run every allocated module and compare all case occurrences
        run: >-
          python tools/run_sharded_regressions.py shard
          --baseline /tmp/acme-before
          --group ${{ matrix.group }} --shard ${{ matrix.shard }}
          --out /tmp/acme-results/${{ matrix.group }}-${{ matrix.shard }}
          --timeout 600
      - name: Preserve complete shard reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b236-shard-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_id }}
          path: /tmp/acme-results/
          if-no-files-found: error

  regression-parity:
    if: ${{ !cancelled() }}
    needs: [full-regression-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: b236-shard-*-${{ github.run_id }}
          merge-multiple: true
          path: /tmp/acme-results
      - name: Require all modules, current regression gates, and no worsening
        run: python tools/run_sharded_regressions.py aggregate --out /tmp/acme-results
      - name: Preserve aggregate and explicit remaining-failure register
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-network-validation-${{ github.run_id }}
          path: /tmp/acme-results/
          if-no-files-found: error

  strict-full-suite:
    if: ${{ !cancelled() }}
    needs: [static, regression-parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: stable-network-validation-${{ github.run_id }}
          path: /tmp/acme-results
      - name: Require genuinely clean full suite (no baseline exemptions)
        run: python tools/run_sharded_regressions.py aggregate --out /tmp/acme-results --require-green
      - name: Require all prerequisite jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PARITY_RESULT: ${{ needs.regression-parity.result }}
        run: test "$STATIC_RESULT" = success && test "$PARITY_RESULT" = success
      # Native Windows/Arma dedicated-server acceptance is a separate recorded
      # manual requirement. This workflow never publishes or certifies it.
