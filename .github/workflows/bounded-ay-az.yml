name: Bounded AY-AZ audit
on:
  push:
    branches: [audit/bounded-backlog-ay-az-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-ay-az-20260923
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/bounded-backlog-ay-az-20260923
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/acme-tools
          curl -fLsS --retry 1 https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64 -o /tmp/acme-tools/hemtt
          echo '58c0f2c1d88041ebce24753e920ac80efb7624d28e8af9b7960c669117695770  /tmp/acme-tools/hemtt' | sha256sum --check
          curl -fLsS --retry 1 https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip -o /tmp/acme-tools/sqfvm.zip
          echo 'bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/acme-tools/sqfvm.zip' | sha256sum --check
          unzip -q /tmp/acme-tools/sqfvm.zip -d /tmp/acme-tools
          chmod +x /tmp/acme-tools/hemtt /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
          python -m pip install 'pytest==9.0.2' 'numpy==2.3.5' 'Pillow==12.3.0' 'soundfile==0.13.1'
      - name: Validate AY-AZ
        env:
          HEMTT: /tmp/acme-tools/hemtt
          SQFVM: /tmp/acme-tools/sqfvm_linux_x64_gcc/sqfvm
        run: |
          python - <<'PY'
          import subprocess,pathlib,xml.etree.ElementTree as ET,json,os
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter

          BASE='d86ff5c3d35bedb6a44839e38f620ed965fd4cde'
          root=pathlib.Path.cwd()
          CAND=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          before=pathlib.Path('/tmp/acme-ayaz-before')
          out=pathlib.Path('/tmp/acme-ay-az-results'); out.mkdir(exist_ok=True)

          def cmd(a,cwd=root,t=480,check=True):
              r=subprocess.run(a,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=t)
              if check and r.returncode: raise RuntimeError(str(a)+'\n'+r.stdout[-12000:])
              return r
          def suite(label,cwd,paths):
              xml=out/(label+'.xml')
              r=cmd(['python','-m','pytest',*paths,'-q','--tb=no','--continue-on-collection-errors','--junitxml='+str(xml)],cwd,430,False)
              d={}
              for c in ET.parse(xml).iter('testcase'):
                  k=(c.get('classname',''),c.get('name',''))
                  d[k]='error' if c.find('error') is not None else 'failed' if c.find('failure') is not None else 'skipped' if c.find('skipped') is not None else 'passed'
              (out/(label+'.log')).write_text(r.stdout)
              return r.returncode,d,Counter(d.values())

          cmd(['git','fetch','--depth=1','origin',BASE])
          cmd(['git','worktree','add','--detach',str(before),BASE])

          focused=[
            'addons/acm_extended/tools/test_b41_ui_airway_medication.py::test_cuff_syringe_uses_real_acm_pbo_prefix',
            'addons/acm_extended/tools/test_b49_intubation_obtunded.py::test_replacement_ten_ml_barrel_is_used_in_both_views',
            'addons/acm_extended/tools/test_b49_intubation_obtunded.py::test_cuff_syringe_tip_anchor_target_and_one_second_push',
            'addons/acm_extended/tools/test_b57_pose_rules_narcbox_cohesion.py::test_menu_open_is_only_empty_hands_and_crouch_transition',
            'addons/acm_extended/tools/test_b57_pose_rules_narcbox_cohesion.py::test_narcbox_cohesive_section_and_selection_fix_retained',
            'addons/acm_extended/tools/test_na8_5_batch2.py::TallySourceAndModel::test_layout_ratios_match_source',
            'addons/acm_extended/tools/test_na8_5_batch6.py::SourceTests::test_all_visual_passes_after_procedure',
          ]
          r=cmd(['python','-m','pytest',*focused,'-q'],root,180,False)
          (out/'focused.log').write_text(r.stdout)
          assert r.returncode==0,r.stdout[-12000:]

          h=cmd([os.environ['HEMTT'],'check'],root,180,False)
          (out/'hemtt.log').write_text(h.stdout)
          assert h.returncode==0,h.stdout[-10000:]
          assert cmd(['git','diff','--check',BASE,CAND],root,60,False).returncode==0

          with ThreadPoolExecutor(max_workers=2) as ex:
              fb=ex.submit(suite,'addon-before',before,['addons/acm_extended/tools'])
              fa=ex.submit(suite,'addon-after',root,['addons/acm_extended/tools'])
              rb,db,cb=fb.result(); ra,da,ca=fa.result()

          missing=set(db)-set(da); regress=[]; fixed=[]
          for k,v in db.items():
              if k not in da: continue
              if v=='failed' and da[k]=='passed': fixed.append(k)
              elif v!=da[k]: regress.append((k,v,da[k]))
          expected={
            'test_cuff_syringe_uses_real_acm_pbo_prefix',
            'test_replacement_ten_ml_barrel_is_used_in_both_views',
            'test_cuff_syringe_tip_anchor_target_and_one_second_push',
            'test_menu_open_is_only_empty_hands_and_crouch_transition',
            'test_narcbox_cohesive_section_and_selection_fix_retained',
            'test_layout_ratios_match_source',
            'test_all_visual_passes_after_procedure',
          }
          assert not missing and not regress,(missing,regress)
          assert {k[1] for k in fixed}==expected,fixed

          with ThreadPoolExecutor(max_workers=2) as ex:
              rb2=ex.submit(suite,'root-before',before,['tools'])
              ra2=ex.submit(suite,'root-after',root,['tools'])
              _,db2,cb2=rb2.result(); _,da2,ca2=ra2.result()
          assert db2==da2 and cb2==ca2,(cb2,ca2)

          changed=set(filter(None,cmd(['git','diff','--name-only',BASE,CAND]).stdout.splitlines()))
          runtime=[p for p in changed if '/functions/' in p and p.endswith('.sqf')]
          assert runtime==[],runtime

          report={
            'base':BASE,'candidate':CAND,
            'focused_passed':7,
            'addon_before':dict(cb),'addon_after':dict(ca),
            'fixed_original_ids':['H137','H194','H195','H209','H214','H429','H439'],
            'remaining_original_entries':35,
            'root_before':dict(cb2),'root_after':dict(ca2),
            'runtime_files_changed':[],
            'hemtt_exit':0,'live_arma_tested':False,'stable_release_approved':False
          }
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acme-bounded-AY-AZ-evidence
          path: /tmp/acme-ay-az-results
          retention-days: 30
