</script><script>
// SQF samples carry offsets from the start of a single patient/device session.
window.addEventListener("DOMContentLoaded", () => {
    const api = window.tp;
    const type = "tempus:waveform";
    const leads = ["I","II","III","AVR","AVL","AVF","V1","V2","V3","V4","V5","V6"];
    const send = packet => window.dispatchEvent(new MessageEvent("message", {
        data: {...packet,type}, origin:location.origin, source:window
    }));
    let epoch = null;
    let endTime = -Infinity;
    let timers = [];
    const channels = [{channel:"ecg"}, ...leads.map(lead=>({channel:"ecg",lead})),
        {channel:"pleth"},{channel:"capno"}];
    api.sampleColumn = (read,time,width) => {
        // Use the actual host lattice. The intervening browser frames cannot erase a narrow R peak.
        let value = read(time);
        if (epoch === null) return value;
        const step = 0.03;
        const first = Math.ceil((time-width/2-epoch)/step-1e-7);
        const last = Math.ceil((time+width/2-epoch)/step-1e-7);
        for (let index=first;index<last;index++) {
            const sample = read(epoch+index*step);
            if (Number.isFinite(sample) && (!Number.isFinite(value) || Math.abs(sample)>Math.abs(value))) value=sample;
        }
        return value;
    };
    api.waveformSession = 0;
    api.resetWaveforms = () => {
        api.waveformSession++;
        for (const timer of timers) clearTimeout(timer);
        timers = [];
        epoch = null;
        endTime = -Infinity;
        // Keep the host channel active with a flat trace during power/connection transitions.
        for (const channel of channels) {
            send({...channel,active:false});
            send({...channel,units:"acme",sampleRateHz:1,samples:[0],startTime:-1e9,holdFlat:true});
        }
    };
    api.waveforms = (packets,reset=false,offset,elapsed,peaks=[]) => {
        if (!Array.isArray(packets) || !packets.length) return;
        if (reset) api.resetWaveforms();
        const now = performance.now()/1000;
        const timed = Number.isFinite(offset) && Number.isFinite(elapsed);
        if (timed && epoch === null) epoch = now - elapsed + 0.06;
        const startTime = timed ? epoch + offset : Math.max(now,endTime);
        if (startTime < endTime - 0.001) return;
        const first = packets[0];
        endTime = startTime + first.samples.length / first.sampleRateHz;
        for (const packet of packets) send({...packet,startTime});
    };
}, {once:true});
