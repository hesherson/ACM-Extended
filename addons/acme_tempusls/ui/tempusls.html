/* ACME interface roles. Device layout and telemetry colors come from the device stylesheet. */
:root {
  --acme-panel: #111214;
  --acme-surface: #18191c;
  --acme-raised: #202125;
  --acme-selected: #303239;
  --acme-rule: #292b30;
  --acme-focus: #9498a2;
  --acme-ink: #f3f1ed;
  --acme-detail: #cbd0da;
}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline-color: var(--acme-focus);
}
body { font-family: "Roboto Condensed", Arial, sans-serif; }
.ls-menu, .ls-menu>h2, .ls-confirm, .ls-info { background-color: var(--acme-surface); border-color: var(--acme-rule); }
.ls-menu-row, .ls-menu-row>button:first-child, .ls-menu-value, .ls-menu-options>button,
.ls-soft-label:not(.blank) { background-color: var(--acme-raised); border-color: var(--acme-rule); }
.ls-menu-row.selected, .ls-menu-row.selected .ls-menu-value,
.ls-menu-options>button.active, .ls-menu-options>button:hover:not(.active),

</script><script>
// SQF samples carry offsets from the start of a single patient/device session.
window.addEventListener("DOMContentLoaded", () => {
    const api = window.tls;
    const type = "tempusLS:waveform";
    const leads = ["I","II","III","AVR","AVL","AVF","V1","V2","V3","V4","V5","V6"];
    const send = packet => window.dispatchEvent(new MessageEvent("message", {
        data: {...packet,type}, origin:location.origin, source:window
    }));
    let epoch = null;
    let endTime = -Infinity;
    let timers = [];
    const channels = [{channel:"ecg"}, ...leads.map(lead=>({channel:"ecg",lead})),
        {channel:"pleth"},{channel:"capno"}];
    api.sampleColumn = (read,time,width) => {
        // Use the actual host lattice. The intervening browser frames cannot erase a narrow R peak.
        let value = read(time);
        if (epoch === null) return value;
        const step = 0.03;
        const first = Math.ceil((time-width/2-epoch)/step-1e-7);
        const last = Math.ceil((time+width/2-epoch)/step-1e-7);
        for (let index=first;index<last;index++) {
            const sample = read(epoch+index*step);
            if (Number.isFinite(sample) && (!Number.isFinite(value) || Math.abs(sample)>Math.abs(value))) value=sample;
        }
        return value;
    };
    api.waveformSession = 0;
    let frame = null;
    api.resetWaveforms = () => {
        frame = null;
        api.waveformSession++;
        for (const timer of timers) clearTimeout(timer);
        timers = [];
        epoch = null;
        endTime = -Infinity;
        // Keep the host channel active with a flat trace during power/connection transitions.
        for (const channel of channels) {
            send({...channel,active:false});
            send({...channel,units:"acme",sampleRateHz:1,samples:[0],startTime:-1e9,holdFlat:true});
        }
    };
    api.waveformPart = (offset, elapsed, first, packets, total, peaks) => {
        if (first === 0) frame = {offset, packets: []};
        if (!frame || frame.offset !== offset || frame.packets.length !== first) return;
        frame.packets.push(...packets);
        if (frame.packets.length === total) {
            const complete = frame.packets;
            frame = null;
            api.waveforms(complete, false, offset, elapsed, peaks);
        }
    };
    api.waveforms = (packets,reset=false,offset,elapsed,peaks=[]) => {
        if (!Array.isArray(packets) || !packets.length) return;
        if (reset) api.resetWaveforms();
        const now = performance.now()/1000;
        const timed = Number.isFinite(offset) && Number.isFinite(elapsed);
        if (timed && epoch === null) epoch = now - elapsed + 0.06;
        const startTime = timed ? epoch + offset : Math.max(now,endTime);
        if (startTime < endTime - 0.001) return;
        const first = packets[0];
        endTime = startTime + first.samples.length / first.sampleRateHz;
        for (const packet of packets) send({...packet,startTime});
        for (const peak of peaks) {
            if (!Number.isInteger(peak) || peak < 0 || peak >= first.samples.length) continue;
            const time = startTime + peak / first.sampleRateHz;
            if (time < now-0.06) continue;
            const timer = setTimeout(() => {
                timers = timers.filter(id=>id !== timer);
                if (!api.hasSyncSignal || performance.now()/1000-time>0.08) return;
                window.dispatchEvent(new MessageEvent("message", {
                    data:{type:"tempusLS:rwave",sampleTime:time},origin:location.origin,source:window
                }));
            }, Math.max(0,time-now)*1000);
            timers.push(timer);
        }
    };
}, {once:true});
</script>
<script>
// Native patient/power lifetimes own therapy authorization; React only presents it.
(()=>{
 let previous=null;
 window.tls.therapy=(session,authorized)=>{
  const view=window.TLS_VIEW;
  if(!view)return;
  const changed=previous!==null&&previous!==session;
  previous=session;
  const staleCharge=!authorized&&view.s.phase==="charged";
  if(!changed&&!staleCharge)return;
  const state={...view.s,phase:"idle",charge:0,chargedAt:null,chargeStarted:null,analysisStarted:null,syncPending:false,message:"SELECT THE ENERGY"};
  if(changed){state.pacing=false;state.current=0;}
  window.dispatchEvent(new CustomEvent("tempusLS:host",{detail:{raw:{type:"LOAD",state}}}));
 };
})();
</script>
