// Model config for the SKED models.
// (Once generated by acme_sked_src/build/make_config_sked.py, with no skeletons and no animations. Since B377 the
// laid-out and the wrapped SKED have one bone: their tow strap, named and made longer by
// tools/build_sked_strap_selection.py. While the SKED is dragged the strap runs from its head end up to the
// rescuer's hip: acme_sked_ace, fn_dragStrapAim.sqf sets the two sources. Both turn it about the memory point
// "head_end": first up (about the model's X), then to the side (about its upright axis).)

class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class acme_sked_strap: Default {
        skeletonBones[] = {"tow_strap", ""};
    };
    // the wrapped SKED: the tow strap, and the five straps over the casualty (tools/build_sked_strap_fit.py)
    class acme_sked_wrapped: Default {
        skeletonBones[] = {"tow_strap", "", "strap_feet", "", "strap_knee", "", "strap_pelvis", "", "strap_belly", "", "strap_chest", ""};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    class sked_pack: Default {};
    class sked_open: Default {
        skeletonName = "acme_sked_strap";
        class Animations {
            class strap_pitch {
                type = "rotationX";
                source = "strap_pitch";
                selection = "tow_strap";
                axis = "head_end";
                memory = 1;
                sourceAddress = "clamp";
                minValue = -1;
                maxValue = 1;
                angle0 = "rad -90";
                angle1 = "rad 90";
            };
            class strap_yaw {
                type = "rotationY";
                source = "strap_yaw";
                selection = "tow_strap";
                axis = "head_end";
                memory = 1;
                sourceAddress = "clamp";
                minValue = -1;
                maxValue = 1;
                angle0 = "rad -90";
                angle1 = "rad 90";
            };
        };
    };
    // Each strap over the casualty goes up and down by its own source (acme_sked_ace, fn_strapFit.sqf, from
    // acmeStrapFitBare[] and acmeStrapFitHpmk[] of the SKED's class). Measured in game: a whole unit of the
    // source moves a strap 1.25 m, not the 0.25 m the offsets below say; fn_strapFit.sqf reckons with 1.25.
    class sked_wrapped: sked_open {
        skeletonName = "acme_sked_wrapped";
        class Animations: Animations {
            class fit_feet {
                type = "translationY";
                source = "fit_feet";
                selection = "strap_feet";
                sourceAddress = "clamp";
                minValue = -1;
                maxValue = 1;
                offset0 = -0.25;
                offset1 = 0.25;
            };
            class fit_knee: fit_feet {
                source = "fit_knee";
                selection = "strap_knee";
            };
            class fit_pelvis: fit_feet {
                source = "fit_pelvis";
                selection = "strap_pelvis";
            };
            class fit_belly: fit_feet {
                source = "fit_belly";
                selection = "strap_belly";
            };
            class fit_chest: fit_feet {
                source = "fit_chest";
                selection = "strap_chest";
            };
            // A strap that crosses the casualty's arms is taken out when a model of it, pulled tight over a bare
            // casualty, hangs on the SKED in its place (tools/build_sked_strap_arcs.py; fn_strapArcs.sqf).
            class own_pelvis {
                type = "hide";
                source = "own_pelvis";
                selection = "strap_pelvis";
                sourceAddress = "clamp";
                minValue = 0;
                maxValue = 1;
                hideValue = 0.5;
            };
            class own_belly: own_pelvis {
                source = "own_belly";
                selection = "strap_belly";
            };
            class own_chest: own_pelvis {
                source = "own_chest";
                selection = "strap_chest";
            };
            class own_knee: own_pelvis {
                source = "own_knee";
                selection = "strap_knee";
            };
            class own_feet: own_pelvis {
                source = "own_feet";
                selection = "strap_feet";
            };
        };
    };
    class sked_rolled: Default {};
    class sked_slung: Default {};
};
