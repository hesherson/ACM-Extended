// Model config for the Ventway Sparrow variants. No animations.
// Hidden selections: camo (body), screen (main display), screen_fio2 (mixer display).
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class acme_ventway_skeleton: Default {};
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    class acme_ventway_base: Default {
        skeletonName = "acme_ventway_skeleton";
        sections[] = {"camo", "screen", "screen_fio2"};
        class Animations {};
    };
    class ventway_bare: acme_ventway_base {};
    class ventway_mixer: acme_ventway_base {};
    class ventway_o2: acme_ventway_base {};
    class ventway_circuit: acme_ventway_base {};
    class ventway_mixer_circuit: acme_ventway_base {};
    class ventway_o2_circuit: acme_ventway_base {};
};
