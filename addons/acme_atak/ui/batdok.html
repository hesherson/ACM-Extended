</style><style id="acme-interface-theme">
/* ACME interface roles. Device layout and telemetry colors come from the device stylesheet. */
:root {
  --acme-panel: #111214;
  --acme-surface: #18191c;
  --acme-raised: #202125;
  --acme-selected: #303239;
  --acme-rule: #292b30;
  --acme-focus: #9498a2;
  --acme-ink: #f3f1ed;
  --acme-detail: #cbd0da;
}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline-color: var(--acme-focus);
}
html, body, .app-viewport, .batdok, .roster, .patient-content { background-color: var(--acme-panel); }
.app-header, .patient-nav, .patient-heading, .roster-labels, .app-menu, .handoff-panel,
.entry-dialog, .entry-dialog-header, .evac-control, .record-table-head {
  background-color: var(--acme-surface); border-color: var(--acme-rule); color: var(--acme-ink);
}
.patient-column:nth-child(2n), .roster-rail, .patient-transfer, .entry-field input,
.patient-meta input, .manual-vitals input, .bd-sel-l { background-color: var(--acme-raised); border-color: var(--acme-rule); }
.patient-column, .roster-labels>.roster-row:first-child { background-color: var(--acme-surface); }
.patient-column, .roster-labels .roster-row, .app-header:after,
.roster-rail, .roster-rail>button { border-color: var(--acme-rule); }
.roster-rail, .roster-rail>button { background-image: none; background-color: var(--acme-raised); }
.header-actions>button.active { background-color: var(--acme-selected); color: var(--acme-ink); }
.patient-nav>button.selected, .entry-dialog-actions .entry-save, .trend-select button.selected,
.bd-sel-l>button.on { background-color: var(--acme-selected); border-color: var(--acme-focus); color: var(--acme-ink); }
