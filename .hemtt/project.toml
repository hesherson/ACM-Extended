name = "ACM Extended"
author = "mavis"
# Preserve ACM's prefix/mainprefix so existing ACM public classes/functions remain compatible.
prefix = "ACM"
mainprefix = "x"

[files]
exclude = [
    "**/.*",
    "**/tools/**/*.py",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/tools/external_entry_points.json",
    "**/tools/external_variables.json",
    "**/tools/na8_5_b8_medication_routes.json",
    "**/tools/na8_action_fixture.json"
]
include = [
    "mod.cpp",
    "logo.paa",
    "logo_small.paa"
]

[version]
git_hash = 0
